{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block body %}
<div class="page-head"><div><div class="eyebrow">Account</div><h1>Change Password</h1><p>Keep your account safe — the old password is verified server-side.</p></div></div>
<div class="card" style="max-width:520px">
  <form method="post">
    <div class="field"><label for="cp-cur">Current password</label><input id="cp-cur" type="password" name="current_password" required autocomplete="current-password"></div>
    <div class="field" style="margin-top:10px"><label for="cp-new">New password <span class="help">(min 6)</span></label><input id="cp-new" type="password" name="new_password" required autocomplete="new-password"></div>
    <div class="field" style="margin-top:10px"><label for="cp-new2">Confirm new password</label><input id="cp-new2" type="password" name="confirm_password" required autocomplete="new-password"></div>
    <button class="btn btn-gold" style="margin-top:14px" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
