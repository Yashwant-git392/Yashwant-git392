{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block body %}
<div class="page-head"><div><h1>Change Password</h1><p>Keep your account safe.</p></div></div>
<div class="card" style="max-width:520px">
  <form method="post">
    <div class="field"><label>Current password</label><input type="password" name="current_password" required></div>
    <div class="field" style="margin-top:10px"><label>New password (min 6)</label><input type="password" name="new_password" required></div>
    <div class="field" style="margin-top:10px"><label>Confirm new password</label><input type="password" name="confirm_password" required></div>
    <button class="btn btn-gold" style="margin-top:12px" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
