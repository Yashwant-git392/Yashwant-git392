{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block body %}
<div class="page-head">
  <div><h1>🔐 Change Password</h1><p>Minimum 6 characters. You will stay signed in after changing.</p></div>
  <a class="btn btn-ghost" href="{{ url_for('dashboard') }}">← Dashboard</a>
</div>
<form method="post" class="card" style="max-width:480px" action="{{ url_for('change_password') }}">
  <div class="field" style="margin-bottom:12px"><label for="old_password">Current Password *</label><input id="old_password" name="old_password" type="password" required autocomplete="current-password"></div>
  <div class="field" style="margin-bottom:12px"><label for="new_password">New Password *</label><input id="new_password" name="new_password" type="password" required minlength="6" autocomplete="new-password"></div>
  <div class="field" style="margin-bottom:12px"><label for="confirm_password">Confirm New Password *</label><input id="confirm_password" name="confirm_password" type="password" required minlength="6" autocomplete="new-password"></div>
  <button class="btn btn-primary" type="submit">Update Password</button>
</form>
{% endblock %}
